name: survival

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hackproof
          POSTGRES_PASSWORD: hackproof
          POSTGRES_DB: hackproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hackproof:hackproof@localhost:5432/hackproof
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run hackproof digest
