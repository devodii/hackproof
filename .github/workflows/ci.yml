name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hackproof
          POSTGRES_PASSWORD: hackproof
          POSTGRES_DB: hackproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hackproof:hackproof@localhost:5432/hackproof
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run sqlfluff lint db/schema src/hackproof/sql
      - name: A schema change needs a migration file
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base...HEAD" -- apps/api/db/schema ':!apps/api/db/schema/manifest.sql')
          added=$(git diff --name-only --diff-filter=A "$base...HEAD" -- apps/api/db/migrations)
          if [ -n "$changed" ] && [ -z "$added" ]; then
            echo "::error::The schema files changed but no migration file was added. Run 'hackproof schema plan' and commit the file it writes."
            exit 1
          fi
      - name: Build the schema on an empty database
        run: uv run hackproof schema apply
      - name: The schema files and the database agree
        run: uv run hackproof schema verify
      - run: uv run pytest
      - name: The openapi schema the web app generates its types from is current
        run: |
          uv run hackproof openapi
          git diff --exit-code -- ../web/openapi.json || {
            echo "::error::The API changed but apps/web/openapi.json did not. Run 'pnpm types' and commit the result."
            exit 1
          }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The generated api types are current
        run: |
          pnpm --filter web types
          git diff --exit-code -- apps/web/src/lib/api-schema.ts || {
            echo "::error::apps/web/openapi.json changed but the generated types did not. Run 'pnpm types' and commit the result."
            exit 1
          }
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  migrate:
    needs: api
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Apply the schema to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the PRODUCTION_DATABASE_URL secret. The schema must be migrated before the API deploys."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/plan"
          uv run hackproof schema apply --remote --out-dir "$RUNNER_TEMP/plan"
      - name: Restore the scan data from the committed files
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: uv run hackproof import --remote
      - name: Keep the plan that ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-plan
          path: ${{ runner.temp }}/plan
          if-no-files-found: ignore

  deploy-api:
    needs: [api, migrate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'data/*.yaml'
              - 'railway.json'
      - if: steps.changes.outputs.api == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN is not set, skipping the deploy"
            exit 0
          fi
          npm install --global @railway/cli
          railway up --service api --ci
