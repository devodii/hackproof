[project]
name = "hackproof"
version = "0.1.0"
description = "Testnet reconstruction of HackMeridian submissions"
authors = [
    { name = "Emmanuel Odii", email = "emmanuelodii80@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "stellar-sdk>=16.1.1",
]

[project.scripts]
hackproof = "hackproof.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
