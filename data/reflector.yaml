packages:
  js: ["@reflector/contract-client"]

signals:
  - slug: client-pulse
    group: client
    label: Pulse client
    patterns: ['\bPulseClient\b', '\bReflectorPulseClient\b', '\bReflectorClient\b']
  - slug: client-beam
    group: client
    label: Beam client
    patterns: ['\bBeamClient\b', '\bReflectorBeamClient\b']
  - slug: client-flare
    group: client
    label: Flare client
    patterns: ['\bFlareClient\b']
  - slug: client-dao
    group: client
    label: DAO client
    patterns: ['\bDaoClient\b']
  - slug: reads-last-price
    group: read
    label: Reads the latest price
    patterns: ['\.lastPrice\(', '\blastprice\s*\(', '\blast_price\s*\(']
  - slug: reads-history
    group: read
    label: Reads price history
    patterns: ['\.prices\(\s*&?[\w"''`]', '\.price\(\s*&?[\w"''`][^)]*,', '\bTWAP\b', '\btwap\b']
  - slug: reads-decimals
    group: safety
    label: Reads decimals()
    patterns: ['\.decimals\(\s*\)', '\bdecimals\(\s*\)']
  - slug: reads-resolution
    group: safety
    label: Reads resolution()
    patterns: ['\.resolution\(\s*\)', '\bresolution\(\s*\)']
  - slug: checks-age
    group: safety
    label: Checks the quote age
    patterns: ['ledger\(\)\.timestamp\(\)', 'Date\.now\(\)', '\bstale\b', '\bStale\w*', 'max_?[aA]ge', '[aA]ge_?[sS]ec']
  - slug: checks-expiry
    group: safety
    label: Checks feed expiry
    patterns: ['\.expires\(', '\bexpires\(\s*&?\w']
  - slug: hardcoded-decimals
    group: risk
    label: Assumes 7 decimals
    patterns: ['\b10\s*\*\*\s*7\b', '\b1e7\b', '\b10_?000_?000\b', 'Math\.pow\(\s*10\s*,\s*7\s*\)']
  - slug: number-cast
    group: risk
    label: Casts the price with Number()
    patterns: ['Number\(\s*[\w.]*\.price\s*\)', 'Number\(\s*(?:quote|data|price)\w*\s*\)']

tickers:
  patterns:
    - '\.last_?[pP]rice\(\s*["''`]([A-Z0-9]{2,10})["''`]'
    - '\.price\(\s*["''`]([A-Z0-9]{2,10})["''`]'
    - 'buildAsset\(\s*["''`]([A-Z0-9]{2,10})["''`]'
    - 'Asset::Other\(\s*(?:Symbol::new\(\s*&?\w+\s*,\s*)?"([A-Z0-9]{2,10})"'
    - 'tag:\s*["'']Other["'']\s*,\s*values:\s*\[\s*["'']([A-Z0-9]{2,10})["'']'
    - 'Other\(\s*["'']([A-Z0-9]{2,10})["'']\s*\)'

oracles:
  - slug: reflector
    name: Reflector
    patterns: ['reflector']
  - slug: redstone
    name: RedStone
    patterns: ['redstone']
  - slug: pyth
    name: Pyth
    patterns: ['pyth(?:net)?\b', '@pythnetwork']
  - slug: band
    name: Band
    patterns: ['bandprotocol', 'band[-_ ]protocol']
  - slug: chainlink
    name: Chainlink
    patterns: ['chainlink']
  - slug: dia
    name: DIA
    patterns: ['\bdiadata\b', 'diaoracle']
