  - slug: reflector
    name: Reflector
    category: oracles
    site: https://reflector.network
    packages:
      js: ["@reflector/contract-client"]
    github_owners: [reflector-network]
    profile:
      adapter: reflector
      params:
        age_factor: 2
      networks:
        testnet:
          rpc_url: https://soroban-testnet.stellar.org
          passphrase: Test SDF Network ; September 2015
          explorer: https://stellar.expert/explorer/testnet/contract
        mainnet:
          rpc_url: https://mainnet.sorobanrpc.com
          passphrase: Public Global Stellar Network ; September 2015
          explorer: https://stellar.expert/explorer/public/contract
      context: [reflector, '\bPulseClient\b', '\bBeamClient\b', '\bFlareClient\b', '\bReflector\w*Client\b']
      contracts:
        - {slug: testnet-fx, id: CCSSOHTBL3LEWUCBBEB5NJFC2OKFRC74OWEIJIZLRJBGAAU4VMU5NV4W, name: Fiat FX, network: testnet, kind: feed, attributes: {source: fx, asset_kind: other}}
        - {slug: testnet-exchanges, id: CCYOZJCOPG34LLQQ7N24YXBM7LL62R7ONMZ3G6WZAAYPB5OYKOMJRN63, name: CEX and DEX, network: testnet, kind: feed, attributes: {source: exchanges, asset_kind: other}}
        - {slug: testnet-stellar-testnet, id: CA2NWEPNC6BD5KELGJDVWWTXUE7ASDKTNQNL6DN3TGBVWFEWSVVGMUAF, name: Stellar Testnet DEX, network: testnet, kind: feed, attributes: {source: stellar-testnet, asset_kind: stellar}}
        - {slug: testnet-stellar-pubnet, id: CAVLP5DH2GJPZMVO7IJY4CVOD5MWEFTJFVPD2YY2FQXOQHRGHK4D6HLP, name: Stellar Pubnet DEX, network: testnet, kind: feed, attributes: {source: stellar-pubnet, asset_kind: stellar}}
        - {slug: mainnet-fx, id: CBKGPWGKSKZF52CFHMTRR23TBWTPMRDIYZ4O2P5VS65BMHYH4DXMCJZC, name: Fiat FX, network: mainnet, kind: feed, attributes: {source: fx, asset_kind: other}}
        - {slug: mainnet-exchanges, id: CAFJZQWSED6YAWZU3GWRTOCNPPCGBN32L7QV43XX5LZLFTK6JLN34DLN, name: CEX and DEX, network: mainnet, kind: feed, attributes: {source: exchanges, asset_kind: other}}
        - {slug: mainnet-stellar-pubnet, id: CALI2BYU2JE6WVRUFYTS6MSBNEHGJ35P4AVCZYF3B6QOE3QKOB2PLE6M, name: Stellar Pubnet DEX, network: mainnet, kind: feed, attributes: {source: stellar-pubnet, asset_kind: stellar}}
        - {slug: xrf, id: CBLLEW7HD2RWATVSMLAGWM4G3WCHSHDJ25ALP4DI6LULV5TU35N2CIZA, name: XRF token, network: mainnet, kind: token}
      live:
        - {contract: testnet-exchanges, asset: BTC}
        - {contract: testnet-exchanges, asset: ETH}
        - {contract: testnet-exchanges, asset: XLM}
        - {contract: testnet-fx, asset: EUR}
        - {contract: testnet-fx, asset: BRL}
        - {contract: testnet-fx, asset: MXN}
      signals:
        - {slug: client-pulse, group: client, label: Pulse client, patterns: ['\bPulseClient\b', '\bReflectorPulseClient\b', '\bReflectorClient\b']}
        - {slug: client-beam, group: client, label: Beam client, patterns: ['\bBeamClient\b', '\bReflectorBeamClient\b']}
        - {slug: client-flare, group: client, label: Flare client, patterns: ['\bFlareClient\b']}
        - {slug: client-dao, group: client, label: DAO client, patterns: ['\bDaoClient\b']}
        - {slug: reads-last-price, group: read, label: Reads the latest price, patterns: ['\.lastPrice\(', '\blastprice\s*\(', '\blast_price\s*\(']}
        - {slug: reads-history, group: read, label: Reads price history, patterns: ['\.prices\(\s*&?[\w"''`]', '\bTWAP\b', '\btwap\b']}
        - {slug: reads-decimals, group: safety, label: Reads decimals(), patterns: ['\.decimals\(\s*\)', '\bdecimals\(\s*\)']}
        - {slug: reads-resolution, group: safety, label: Reads resolution(), patterns: ['\.resolution\(\s*\)', '\bresolution\(\s*\)']}
        - {slug: checks-age, group: safety, label: Checks the quote age, patterns: ['ledger\(\)\.timestamp\(\)', 'Date\.now\(\)', '\bstale\b', '\bStale\w*', 'max_?[aA]ge', '[aA]ge_?[sS]ec']}
        - {slug: checks-expiry, group: safety, label: Checks feed expiry, patterns: ['\.expires\(', '\bexpires\(\s*&?\w']}
        - {slug: hardcoded-decimals, group: risk, label: Assumes 7 decimals, patterns: ['\b10\s*\*\*\s*7\b', '\b1e7\b', '\b10_?000_?000\b', 'Math\.pow\(\s*10\s*,\s*7\s*\)']}
        - {slug: number-cast, group: risk, label: Casts the price with Number(), patterns: ['Number\(\s*[\w.]*\.price\s*\)', 'Number\(\s*(?:quote|data|price)\w*\s*\)']}
      captures:
        - slug: tickers
          label: Assets it asks the oracle for
          patterns:
            - '\.last_?[pP]rice\(\s*["''`]([A-Z0-9]{2,10})["''`]'
            - '\.price\(\s*["''`]([A-Z0-9]{2,10})["''`]'
            - 'buildAsset\(\s*["''`]([A-Z0-9]{2,10})["''`]'
            - 'Asset::Other\(\s*(?:Symbol::new\(\s*&?\w+\s*,\s*)?"([A-Z0-9]{2,10})"'
            - 'tag:\s*["'']Other["'']\s*,\s*values:\s*\[\s*["'']([A-Z0-9]{2,10})["'']'
            - 'Other\(\s*["'']([A-Z0-9]{2,10})["'']\s*\)'
      checks:
        - {slug: no-age-check, severity: warn, label: Reads prices without checking how old they are, requires: [reads-last-price], missing: [checks-age]}
        - {slug: assumed-decimals, severity: warn, label: Scales prices as if they had 7 decimals, requires: [hardcoded-decimals, reads-last-price], missing: [reads-decimals]}
        - {slug: lossy-price, severity: warn, label: Turns a 14 decimal bigint price into a Number, requires: [number-cast], missing: []}
        - {slug: wrong-network, severity: fail, label: Only points at mainnet feeds while the event runs on testnet, only_networks: [mainnet]}

