partners:
  - slug: trustless-work
    name: Trustless Work
    category: payments
    site: https://www.trustlesswork.com
    packages:
      js: ["@trustless-work/escrow", "@trustless-work/blocks", "@trustless-work/skill"]
    endpoints: [api.trustlesswork.com, dev.api.trustlesswork.com]
    github_owners: [Trustless-Work]

  - slug: stellar-wallets-kit
    name: Stellar Wallets Kit
    category: wallets
    site: https://stellarwalletskit.dev
    packages:
      js: ["@creit.tech/stellar-wallets-kit"]
    github_owners: [Creit-Tech]

  - slug: freighter
    name: Freighter
    category: wallets
    site: https://www.freighter.app
    packages:
      js: ["@stellar/freighter-api"]

  - slug: privy
    name: Privy
    category: wallets
    site: https://www.privy.io
    packages:
      js: ["@privy-io/react-auth", "@privy-io/node", "@privy-io/server-auth"]
    endpoints: [auth.privy.io, api.privy.io]
    github_owners: [privy-io]

  - slug: passkey-kit
    name: Passkey Kit
    category: wallets
    site: https://github.com/kalepail/passkey-kit
    packages:
      js: [passkey-kit]

  - slug: dfns
    name: Dfns
    category: wallets
    site: https://www.dfns.co
    packages:
      js: ["@dfns/sdk"]

  - slug: soroswap
    name: Soroswap
    category: defi
    site: https://soroswap.finance
    packages:
      js: ["@soroswap/sdk"]
      rust: [soroswap-library]
    endpoints: [api.soroswap.finance]
    github_owners: [soroswap]

  - slug: defindex
    name: DeFindex
    category: defi
    site: https://www.defindex.io
    packages:
      js: ["@defindex/sdk"]
    endpoints: [api.defindex.io]
    github_owners: [paltalabs, defindex-io]

  - slug: blend
    name: Blend
    category: defi
    site: https://www.blend.capital
    packages:
      js: ["@blend-capital/blend-sdk"]
      rust: [blend-contract-sdk]
    github_owners: [blend-capital]

  - slug: stellar-broker
    name: Stellar Broker
    category: defi
    site: https://stellar.broker
    packages:
      js: ["@stellar-broker/client"]
    endpoints: [api.stellar.broker]
    github_owners: [stellar-broker]

  - slug: allbridge
    name: Allbridge
    category: cross-chain
    site: https://allbridge.io
    packages:
      js: ["@allbridge/bridge-core-sdk"]
    github_owners: [allbridge-io]

  - slug: circle
    name: Circle (CCTP)
    category: cross-chain
    site: https://www.circle.com
    packages:
      js: ["@circle-fin/bridge-kit"]
    endpoints: [api.circle.com]

  - slug: layerzero
    name: LayerZero
    category: cross-chain
    site: https://layerzero.network
    packages:
      js: ["@layerzerolabs/lz-v2-utilities"]

  - slug: near-intents
    name: NEAR Intents
    category: cross-chain
    site: https://docs.near.org/chain-abstraction/intents/overview
    packages:
      js: ["@defuse-protocol/intents-sdk", "@defuse-protocol/one-click-sdk-typescript"]
    endpoints: [1click.chaindefuser.com]

  - slug: axelar
    name: Axelar
    category: cross-chain
    site: https://www.axelar.network
    packages:
      js: ["@axelar-network/axelarjs-sdk"]
      rust: [stellar-axelar-std]

tools:
  - slug: stellar-scaffold
    name: Scaffold Stellar
    site: https://github.com/theahaco/scaffold-stellar
    packages:
      rust:
        [stellar-scaffold-cli, stellar-scaffold-macro, stellar-scaffold-ext-types, stellar-scaffold-reporter]
      js: ["@stellar-scaffold/app-lib", "@stellar-scaffold/ui"]
    github_owners: [theahaco, stellar-scaffold]

  - slug: stellar-registry
    name: Stellar Registry
    site: https://github.com/stellar-registry
    packages:
      rust:
        [
          stellar-registry,
          stellar-registry-build,
          stellar-registry-cli,
          stellar-registry-macro,
          stellar-registry-name,
        ]
    github_owners: [stellar-registry, theahaco]

agents:
  - slug: claude-code
    name: Claude Code
    site: https://claude.com/product/claude-code
    files: [CLAUDE.md, ".claude/*"]
    authors: [claude, "claude[bot]"]

  - slug: cursor
    name: Cursor
    site: https://cursor.com
    files: [".cursor/*", .cursorrules, .cursorignore]
    authors: [cursoragent]

  - slug: codex
    name: OpenAI Codex
    site: https://openai.com/codex
    files: [".codex/*"]
    authors: [codex]

  - slug: github-copilot
    name: GitHub Copilot
    site: https://github.com/features/copilot
    files: [".github/copilot-instructions.md", ".github/instructions/*", ".github/agents/*"]
    authors: [copilot, "copilot-swe-agent[bot]"]

  - slug: windsurf
    name: Windsurf
    site: https://windsurf.com
    files: [.windsurfrules, ".windsurf/*"]

  - slug: gemini-cli
    name: Gemini CLI
    site: https://github.com/google-gemini/gemini-cli
    files: [GEMINI.md, ".gemini/*"]

  - slug: cline
    name: Cline
    site: https://cline.bot
    files: [.clinerules, ".clinerules/*", ".cline/*"]

  - slug: kiro
    name: Kiro
    site: https://kiro.dev
    files: [".kiro/*"]

  - slug: devin
    name: Devin
    site: https://devin.ai
    authors: ["devin-ai-integration[bot]"]

  - slug: jules
    name: Jules
    site: https://jules.google
    authors: ["google-labs-jules[bot]"]

  - slug: agents-md
    name: AGENTS.md
    site: https://agents.md
    files: [AGENTS.md]
